<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Guías de WalQo</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/branding/walqo-mark.png" type="image/png" />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" />
  <link rel="stylesheet" href="/assets/site.css" />
</head>
<body>
  <main>
    <section class="page-hero">
      <div class="wrap">
        <a class="brand" href="/">
          <img src="/branding/walqo-mark.png" alt="" width="28" height="28" />
          WalQo
        </a>
        <h1 style="margin-top:18px">Guías para arrancar</h1>
        <p class="lede">Videos cortos. Miralos desde la app y volvé al mostrador.</p>
      </div>
    </section>
    <section class="block">
      <div class="wrap" style="display:grid;gap:28px">
        <article id="producto">
          <h2>Cargar un producto</h2>
          <video controls playsinline preload="metadata" style="width:100%;border-radius:16px;margin-top:12px;background:#000">
            <source src="/marketing/videos/crear-producto.mp4" type="video/mp4" />
          </video>
        </article>
        <article id="venta">
          <h2>Hacer una venta</h2>
          <video controls playsinline preload="metadata" style="width:100%;border-radius:16px;margin-top:12px;background:#000">
            <source src="/marketing/videos/venta.mp4" type="video/mp4" />
          </video>
        </article>
        <article id="tiendanube">
          <h2>Conectar Tienda Nube</h2>
          <video controls playsinline preload="metadata" style="width:100%;border-radius:16px;margin-top:12px;background:#000">
            <source src="/marketing/videos/tiendanube.mp4" type="video/mp4" />
          </video>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
