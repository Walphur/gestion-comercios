<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>WalQo — Logo lockup</title>
  <link rel="stylesheet" href="mock/shared.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1220;
    }
    .lockup {
      width: 900px;
      padding: 64px 72px;
      text-align: center;
      background: linear-gradient(160deg, #0f172a 0%, #111827 100%);
      border-radius: 24px;
      border: 1px solid rgb(255 255 255 / 0.08);
    }
    .lockup svg { width: 120px; height: 120px; margin-bottom: 24px; }
    .lockup h1 {
      font-family: "Sora", sans-serif;
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #fff;
      margin-bottom: 16px;
    }
    .lockup p {
      font-size: 28px;
      color: #94a3b8;
      line-height: 1.4;
      max-width: 680px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="lockup" id="capture">
    <svg viewBox="0 0 256 256" aria-hidden="true"><defs><linearGradient id="t" x1="168" y1="156" x2="208" y2="214"><stop offset="0%" stop-color="#7EB0FF"/><stop offset="100%" stop-color="#B794FF"/></linearGradient></defs><path d="M196 176A78 78 0 1 0 128 204" fill="none" stroke="#4B8BFF" stroke-width="42" stroke-linecap="round"/><rect x="164" y="148" width="32" height="80" rx="16" transform="rotate(-42 180 188)" fill="url(#t)"/></svg>
    <h1>WalQo</h1>
    <p>Simplificá la gestión.<br />Impulsá el crecimiento.</p>
  </div>
</body>
</html>
