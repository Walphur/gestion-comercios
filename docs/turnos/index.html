<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1d4ed8" />
  <title>Reservar turno</title>
  <link rel="stylesheet" href="turnos.css" />
</head>
<body>
  <header>
    <div class="mark" aria-hidden="true">W</div>
    <div class="titles">
      <p class="kicker">Reserva</p>
      <h1 id="biz">Cargando…</h1>
    </div>
  </header>
  <main>
    <p id="status" class="note">Cargando la agenda…</p>
    <section id="app" hidden>
      <div id="progress" class="progress"></div>
      <section class="card">
        <h2 id="stepTitle"></h2>
        <p id="stepHint" class="note"></p>
        <div id="stepBody"></div>
        <p id="formErr" class="err"></p>
        <div class="actions">
          <button type="button" id="back" class="ghost">Volver</button>
          <button type="button" id="next" class="primary">Seguir</button>
        </div>
      </section>
    </section>
    <section id="done" class="card" hidden>
      <h2>Turno programado</h2>
      <p id="doneText"></p>
      <p class="note">Quedó guardado. Si el local tiene la compu cerrada, el turno aparece en la agenda cuando la abran. El pago es en el local.</p>
      <button type="button" id="again" class="ghost">Reservar otro turno</button>
    </section>
  </main>
  <script src="turnos.js"></script>
</body>
</html>
