name = "walqo-web"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Una base SQLite por comercio (Durable Object), con las migraciones de src-tauri/migrations.
[[durable_objects.bindings]]
name = "STORE"
class_name = "StoreDb"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StoreDb"]

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# src/db se comparte con la PC: sus imports de Tauri van a versiones de servidor.
[alias]
"@tauri-apps/plugin-sql" = "./src/shims/pluginSql.ts"
"@tauri-apps/api/core" = "./src/shims/tauriCore.ts"
"@tauri-apps/api/app" = "./src/shims/tauriApp.ts"
"@tauri-apps/api/event" = "./src/shims/tauriEvent.ts"
"@tauri-apps/plugin-opener" = "./src/shims/tauriNoop.ts"
"@tauri-apps/plugin-process" = "./src/shims/tauriNoop.ts"
"@tauri-apps/plugin-updater" = "./src/shims/tauriNoop.ts"

# Cuentas y licencias de WalQo (Worker→Worker; en local, con license-api corriendo en wrangler dev).
[[services]]
binding = "LICENSE"
service = "gestion-comercios-license"

# Entrar, crear cuenta y códigos por mail: tope por IP y por email (period solo admite 10 o 60 s).
[[ratelimits]]
name = "LOGIN_IP_LIMIT"
namespace_id = "2001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "LOGIN_EMAIL_LIMIT"
namespace_id = "2002"
simple = { limit = 5, period = 60 }

[vars]
# Orígenes que pueden usar la API desde el navegador (separados por coma). En local, .dev.vars suma localhost.
ALLOWED_ORIGINS = "https://walqo.pro"
LICENSE_API_URL = "https://gestion-comercios-license.walphur.workers.dev"
# Secrets: SESSION_SECRET (firma las sesiones) y WEB_SERVICE_SECRET (el mismo que en license-api).
